name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para obtener historial completo de git

      - name: Get version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Update version in tauri.conf.json
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            config.version = '${{ steps.get_version.outputs.version }}';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(config, null, 2));
          "

      - name: Update version in Cargo.toml
        shell: bash
        run: |
          sed -i.bak 's/^version = ".*"/version = "${{ steps.get_version.outputs.version }}"/' src-tauri/Cargo.toml

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          # Obtener el último tag (versión anterior)
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          # Generar release notes user-friendly
          NOTES=$(node .github/scripts/generate-release-notes.cjs "$PREV_TAG" HEAD)
          
          # Guardar en variable de entorno para el siguiente step
          # Usamos EOF delimiter para contenido multilinea
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # También mostrar en logs para debugging
          echo "=== Release Notes Generated ==="
          echo "$NOTES"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.get_version.outputs.version }}
          releaseName: 'PC Monitoring Dockers v${{ steps.get_version.outputs.version }}'
          releaseBody: |
            # PC Monitoring Dockers v${{ steps.get_version.outputs.version }}
            
            ${{ steps.release_notes.outputs.RELEASE_NOTES }}
            
            ---
            
            ### 📥 Instalación
            
            Descarga el instalador para Windows:
            - **Setup (recomendado)**: `PC.Monitoring.Dockers_${{ steps.get_version.outputs.version }}_x64-setup.exe`
            - **MSI**: `PC.Monitoring.Dockers_${{ steps.get_version.outputs.version }}_x64_en-US.msi`
            
            La aplicación se actualizará automáticamente en versiones futuras.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
